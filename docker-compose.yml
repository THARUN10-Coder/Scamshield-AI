version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamshield-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ScamShield AI
      - DATABASE_URL=sqlite:///./scamshield.db
      - SECRET_KEY=scamshield-super-secret-key-production-change
    volumes:
      - scamshield-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scamshield-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  scamshield-data:
